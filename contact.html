</head>

<body>

<header class="navbar">

    <a href="index.html" class="brand">
        <span class="brand-mark">P</span>
        <span class="brand-name">PRIYADHARSHINI</span>
    </a>

    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="skills.html">Skills</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>

</header>


<main class="contact-section">

    <div class="contact-container">

        <!-- LEFT SIDE -->

        <div class="contact-info">

            <p class="small-title">CONTACT</p>

            <h1>
                Get in <span>Touch</span>
            </h1>

            <p class="description">
                Feel free to reach out for developing collaboration,
                project discussions or any opportunities.
            </p>


            <div class="details">

                <div class="detail-item">

                    <span>Email</span>

                    <a href="https://accounts.google.com/SignOutOptions?hl=en-GB&continue=https://mail.google.com/mail&service=mail&ec=GBRAFw">
                       priyaxzzz.gmail 
                    </a>

                </div>


                <div class="detail-item">

                    <span>LinkedIn</span>

                    <a
                        href="https://www.linkedin.com/in/priya-siva-8b4496442"
                        target="_blank"
                    >
            priyazzz.linkedin
                    </a>

                </div>


                <div class="detail-item">

                    <span>GitHub</span>

                    <a
                        href="https://github.com/priyaxzzzz"
                        target="_blank"
                    >
                 priyaxzzzz
                    </a>

                </div>

            </div>

        </div>


        <!-- RIGHT SIDE FORM -->

        <div class="contact-form">

            <form>

                <div class="form-group">

                    <label for="name">Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Your Name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="yourmail@gmail.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="message">Message</label>

                    <textarea
                        id="message"
                        rows="5"
                        placeholder="Write your message..."
                        required
                    ></textarea>

                </div>


                <button type="submit">
                    Send Message
                    <span>→</span>
                </button>

            </form>

        </div>

    </div>

</main>

</body>
</html>
